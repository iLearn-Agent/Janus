<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音通话</title><link rel="stylesheet" href="./voiceCallWindow.css"></head><body><main class="call-room"><header class="titlebar"><div class="title-left"><span class="app-mark">◉</span><span class="tag">语音通话</span><strong id="call-title">通话</strong><span id="call-status">正在呼叫…</span><time id="duration">00:00</time></div><div class="title-actions"><button id="minimize" aria-label="最小化">—</button><button id="maximize" aria-label="最大化">□</button><button id="close" aria-label="关闭">×</button></div></header><section class="stage" id="stage"></section><section class="share-strip" id="share-strip"><span>正在共享屏幕</span><button id="return-call">返回通话</button><button id="stop-share">结束共享</button></section><div id="incoming-actions" class="incoming-actions"><span>等待对方接听</span><button id="accept">接通</button></div><section id="composer" class="composer"><input id="chat-input" placeholder="输入消息…"><button id="emoji" class="composer-tool" title="表情">☺</button><button id="send" class="send-btn">发送</button></section><div id="emoji-picker" class="emoji-picker"></div><nav class="toolbar"><button id="mute"><i>♩</i><span>静音</span></button><button id="speaker"><i>🔊</i><span>扬声器</span></button><button id="share"><i>▣</i><span>共享屏幕</span></button><button id="members"><i>♙</i><span>成员</span></button><button id="record"><i>●</i><span>录制</span></button><button id="invite"><i>＋</i><span>邀请</span></button><button id="hangup" class="hangup"><i>☎</i><span>挂断</span></button></nav><aside id="chat-panel" class="chat-panel show"><button id="chat-toggle" type="button" aria-label="收起弹幕">‹</button><div id="chat-log"></div></aside></main><dialog id="members-dialog"><header><strong>参会成员</strong><button id="close-members">×</button></header><div class="member-search"><input id="member-search" placeholder="搜索成员"></div><div id="member-list"></div></dialog><dialog id="invite-dialog"><header><strong>邀请联系人</strong><button id="close-invite">×</button></header><div id="invite-list"></div></dialog><div id="profile-card" class="profile-card"></div><dialog id="rename-dialog"><form method="dialog"><header><strong>修改会中昵称</strong><button value="cancel" type="submit">×</button></header><input id="rename-input" maxlength="32" placeholder="请输入会中昵称"><footer><button value="cancel" type="submit">取消</button><button id="rename-submit" value="default" type="submit">保存</button></footer></form></dialog><div id="toast"></div><script type="module" src="./voiceCallWindow.js"></script></body></html>
