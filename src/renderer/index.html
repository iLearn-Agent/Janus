<!doctype html>
<html lang="en" data-default-language="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janus</title>
    <script>
      try {
        const platform = new URLSearchParams(location.search).get('platform');
        if (platform) document.documentElement.dataset.platform = platform;
        if (localStorage.getItem('janus-language-mode') === 'zh-CN') document.documentElement.lang = 'zh-CN';
      } catch {}
    </script>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: #f6f7f8; }
      .janus-startup-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        color: #18202a;
        background:
          radial-gradient(circle at 72% 22%, rgba(75, 126, 214, .11), transparent 34%),
          linear-gradient(145deg, #f7f9fc, #eef2f7);
        font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      }
      .janus-startup-shell > div { text-align: center; }
      .janus-startup-shell strong { display: block; font-family: var(--font-display, inherit); font-size: 20px; letter-spacing: .02em; }
      .janus-startup-shell span { display: block; margin-top: 8px; color: #6b778c; font-size: 13px; }
      [data-startup-language] { display: none !important; }
      html[lang="en"] [data-startup-language="en"], html[lang="zh-CN"] [data-startup-language="zh-CN"] { display: block !important; }
      .janus-startup-dots { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
      .janus-startup-dots i { width: 6px; height: 6px; border-radius: 50%; background: #4f7fcf; animation: janus-dot 1s ease-in-out infinite; }
      .janus-startup-dots i:nth-child(2) { animation-delay: .14s; }
      .janus-startup-dots i:nth-child(3) { animation-delay: .28s; }
      @keyframes janus-dot { 0%, 100% { opacity: .28; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { .janus-startup-dots i { animation: none; opacity: .65; } }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"><main class="janus-startup-shell" role="status" aria-live="polite"><div><strong data-startup-language="en">Opening Janus</strong><span data-startup-language="en">Loading your local workspace first; online content will sync shortly.</span><strong data-startup-language="zh-CN">正在打开 Janus</strong><span data-startup-language="zh-CN">优先载入本地工作区，在线内容稍后同步</span><div class="janus-startup-dots" aria-hidden="true"><i></i><i></i><i></i></div></div></main></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
