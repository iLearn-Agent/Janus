<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Janus</title>
    <script>
      const platform = new URLSearchParams(location.search).get('platform');
      if (platform) document.documentElement.dataset.platform = platform;
    </script>
    <style>
      :root {
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-display: var(--font-ui);
        color-scheme: light;
        font-family: var(--font-ui);
      }
      :root[data-platform="darwin"] {
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      :root[data-platform="win32"] {
        --font-ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        --font-display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #172033;
        background:
          radial-gradient(circle at 18% 10%, rgba(91, 141, 239, .20), transparent 38%),
          radial-gradient(circle at 88% 86%, rgba(93, 211, 179, .16), transparent 42%),
          linear-gradient(145deg, #f8faff 0%, #eef3fb 54%, #f7f9fc 100%);
        user-select: none;
      }
      main { width: min(360px, calc(100vw - 48px)); text-align: center; }
      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        place-items: center;
        border: 1px solid rgba(53, 91, 155, .14);
        border-radius: 22px;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 20px 50px rgba(54, 78, 118, .16);
      }
      .mark img { width: 48px; height: 48px; object-fit: contain; }
      h1 { margin: 0; font-family: var(--font-display); font-size: 25px; letter-spacing: .02em; }
      p { min-height: 22px; margin: 8px 0 20px; color: #66738a; font-size: 13px; }
      .track { height: 4px; overflow: hidden; border-radius: 99px; background: rgba(64, 91, 135, .12); }
      .track::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4f7fcf, #61bda7);
        animation: progress 1.15s ease-in-out infinite;
        content: "";
      }
      small { display: block; margin-top: 16px; color: #8994a7; font-size: 11px; letter-spacing: .08em; }
      @keyframes progress { from { transform: translateX(-115%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .track::after { width: 72%; animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="../../assets/icons/icon.png" alt="" /></div>
      <h1>Janus</h1>
      <p id="startup-stage">Checking local data…</p>
      <div class="track" aria-hidden="true"></div>
      <small>LOCAL-FIRST AGENT WORKSPACE</small>
    </main>
    <script>
      window.setStartupStage = (message) => {
        const stage = document.getElementById('startup-stage');
        if (stage) stage.textContent = String(message || 'Starting…');
      };
    </script>
  </body>
</html>
