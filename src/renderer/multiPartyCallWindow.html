<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多人通话</title><link rel="stylesheet" href="./multiPartyCallWindow.css"></head><body><main><header><strong id="title">多人通话</strong><span id="status">连接中…</span><button id="close" aria-label="关闭">×</button></header><section id="grid" class="grid"></section><aside class="chat"><div id="chat-log"></div><form id="chat-form"><input id="chat-input" placeholder="发送消息"><button type="submit">发送</button></form></aside><footer><button id="mute">静音</button><button id="camera">摄像头</button><button id="share">共享屏幕</button><button id="invite">邀请成员</button><button id="kick">移除成员</button><button id="record">录音</button><button id="end-room">结束通话</button><button id="hangup" class="danger">离开</button></footer></main><script type="module" src="./multiPartyCallWindow.js"></script></body></html>
