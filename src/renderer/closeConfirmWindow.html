<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关闭 Janus</title><link rel="stylesheet" href="./closeConfirmWindow.css"></head><body><main><button id="closeX" class="close-x" type="button" aria-label="取消" title="取消">×</button><div class="mark">◉</div><h1 id="title">关闭 Janus</h1><p id="message">关闭最后一个窗口时，Janus 应该如何处理？</p><p id="detail">选择后台运行可继续本机任务；选择退出 Janus 将结束本机任务。</p><label class="remember"><input id="remember" type="checkbox"><span id="rememberText">记住我的选择并不再询问</span></label><footer><button id="cancel" class="secondary">取消</button><button id="background" class="secondary">后台运行</button><button id="quit" class="primary">退出 Janus</button></footer></main><script type="module" src="./closeConfirmWindow.js"></script></body></html>
