<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janus Mobile</title>
<style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#18202a}main{max-width:680px;margin:auto;padding:18px}button,input,textarea{font:inherit;padding:10px;border:1px solid #ccd3dc;border-radius:8px}button{background:#1769e0;color:white;border:0}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 10px}article{background:white;padding:12px;border-radius:10px;margin:8px 0;box-shadow:0 1px 4px #0001}.muted{color:#687586;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1}</style>
<main><h1>Janus Mobile</h1><section id="connect"><p>首次使用：在电脑端 Janus 获取配对码。</p><input id="base" placeholder="电脑地址，例如 http://192.168.1.20:3210"><input id="code" placeholder="6 位配对码"><button onclick="pair()">配对</button></section><section id="app" hidden><div class="row"><button onclick="newSession()">新建 uBuddy 会话</button><button onclick="loadSessions()">刷新会话</button></div><div id="sessions"></div><div id="chat" hidden><h2 id="title"></h2><div id="messages"></div><textarea id="instruction" rows="4" placeholder="输入新的指令"></textarea><button onclick="send()">发送</button><p id="run" class="muted"></p></div></section></main>
<script>let base=localStorage.janusBase||location.origin+'/mobile',token=localStorage.janusToken||'',sid='';const $=id=>document.getElementById(id);if(base&&token){$('connect').hidden=true;$('app').hidden=false;loadSessions();connectEvents()}$('base').value=base;async function api(path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+token,...opt.headers}});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}function handleEvent(e){try{const j=JSON.parse(e.data);if(j.run?.id&&j.run.id===window.activeRunId){$('run').textContent=j.run.status+(j.run.answer?'：'+j.run.answer:'');if(['completed','failed','cancelled'].includes(j.run.status)){openSession(j.run.sessionId,$('title').textContent)}}}catch{}}function connectEvents(){if(!token||!window.EventSource)return;const es=new EventSource(base+'/events?token='+encodeURIComponent(token));es.addEventListener('janus',handleEvent);es.onerror=()=>es.close()}async function pair(){base=$('base').value.replace(/\/$/,'');try{const j=await fetch(base+'/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('code').value,deviceName:'手机'})}).then(r=>r.json());if(!j.token)throw Error(j.error||'配对失败');token=j.token;localStorage.janusBase=base;localStorage.janusToken=token;$('connect').hidden=true;$('app').hidden=false;connectEvents();loadSessions()}catch(e){alert(e.message)}}async function loadSessions(){try{const j=await api('/sessions');$('sessions').innerHTML=j.sessions.map(s=>`<article onclick="openSession('${s.id}','${(s.title||'会话').replaceAll("'",'')}')"><b>${s.title||'未命名会话'}</b><div class=muted>${s.updatedAt||''}</div></article>`).join('')||'<p>暂无会话</p>'}catch(e){alert(e.message)}}async function newSession(){try{const j=await api('/sessions/new',{method:'POST',body:JSON.stringify({title:'uBuddy'})});await loadSessions();openSession(j.session.id,j.session.title)}catch(e){alert(e.message)}}async function openSession(id,title){sid=id;$('chat').hidden=false;$('title').textContent=title;const j=await api('/sessions/'+encodeURIComponent(id)+'/messages');$('messages').innerHTML=j.messages.map(m=>`<article><b>${m.role==='user'?'我':'Janus'}</b><div>${(m.content||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\n','<br>')}</div></article>`).join('');}async function send(){const instruction=$('instruction').value.trim();if(!instruction)return;$('instruction').value='';const j=await api('/chat/send',{method:'POST',body:JSON.stringify({sessionId:sid,instruction})});window.activeRunId=j.run.id;$('run').textContent='执行中…';const timer=setInterval(async()=>{if(window.activeRunId!==j.run.id){clearInterval(timer);return}try{const x=await api('/runs/'+encodeURIComponent(j.run.id));$('run').textContent=x.run.status+(x.run.answer?'：'+x.run.answer:'');if(['completed','failed','cancelled'].includes(x.run.status)){clearInterval(timer);window.activeRunId='';await openSession(x.run.sessionId,$('title').textContent);}}catch(e){clearInterval(timer);$('run').textContent=e.message}},1000)}</script>
