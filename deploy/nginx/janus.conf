server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name your-janus.example _;

    client_max_body_size 200m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8788/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/social/events/stream {
        proxy_pass http://127.0.0.1:8788/api/social/events/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8788/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /janus-sync/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        # MinIO verifies the public host as part of the presigned request.
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 60m;
    }

    location /janus/releases/ {
        alias /path/to/janus-cloud/releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location /janus/test_releases/ {
        alias /path/to/janus-cloud/test_releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 200 "Janus cloud is running.\n";
        add_header Content-Type text/plain;
    }
}
